1px}.dash-header{align-items:flex-start}.brand{font-size:21px}}

<header class="nav"><span class="brand"><span class="brandicon">✦</span> Sentence<span>Academy</span></span><span class="navright">A1 → A2 · İngilis dili məşqləri</span></header><main class="container"><div id="app"></div></main><footer>Yaradıcı: <strong>Namiq Bağırlı</strong> · <a href="tel:+994506097097">Əlaqə: 0506097097</a> · Sentence Academy</footer><script>const bank=[{"id":"q001","category":"order","prompt":"every / day / I / books / read","answer":"I read books every day.","alternatives":[],"explanation":"İngilis cümləsində əsas söz sırası: mübtəda + fel + tamamlıq/zərflik.","level":1,"mode":"sentence"},{"id":"q002","category":"order","prompt":"Sundays / tennis / She / plays / on","answer":"She plays tennis on Sundays.","alternatives":[],"explanation":"İngilis cümləsində əsas söz sırası: mübtəda + fel + tamamlıq/zərflik.","level":1,"mode":"sentence"},{"id":"q003","category":"order","prompt":"drinks / the / morning / milk / in / He","answer":"He drinks milk in the morning.","alternatives":[],"explanation":"İngilis cümləsində əsas söz sırası: mübtəda + fel + tamamlıq/zərflik.","level":1,"mode":"sentence"},{"id":"q004","category":"order","prompt":"grandparents / We / visit / our / Saturdays / on","answer":"We visit our grandparents on Saturdays.","alternatives":[],"explanation":"İngilis cümləsində əsas söz sırası: mübtəda + fel + tamamlıq/zərflik.","level":1,"mode":"sentence"},{"id":"q005","category":"order","prompt":"watch / at / night / TV / They","answer":"They watch TV at night.","alternatives":[],"explanation":"İngilis cümləsində əsas söz sırası: mübtəda + fel + tamamlıq/zərflik.","level":1,"mode":"sentence"},{"id":"q006","category":"order","prompt":"brother / apples / My / very / likes / much","answer":"My brother likes apples very much.","alternatives":[],"explanation":"İngilis cümləsində əsas söz sırası: mübtəda + fel + tamamlıq/zərflik.","level":1,"mode":"sentence"},{"id":"q007","category":"order","prompt":"English / sister / My / after / school / studies","answer":"My sister studies English after school.","alternatives":[],"explanation":"İngilis cümləsində əsas söz sırası: mübtəda + fel + tamamlıq/zərflik.","level":1,"mode":"sentence"},{"id":"q008","category":"order","prompt":"park / play / The / children / in / football / the","answer":"The children play football in the park.","alternatives":[],"explanation":"İngilis cümləsində əsas söz sırası: mübtəda + fel + tamamlıq/zərflik.","level":2,"mode":"sentence"},{"id":"q009","category":"order","prompt":"class / teacher / in / Our / speaks / English","answer":"Our teacher speaks English in class.","alternatives":[],"explanation":"İngilis cümləsində əsas söz sırası: mübtəda + fel + tamamlıq/zərflik.","level":2,"mode":"sentence"},{"id":"q010","category":"order","prompt":"parents / evening / dinner / every / cook / My","answer":"My parents cook dinner every evening.","alternatives":[],"explanation":"İngilis cümləsində əsas söz sırası: mübtəda + fel + tamamlıq/zərflik.","level":2,"mode":"sentence"},{"id":"q011","category":"order","prompt":"Tom / after / rides / his / lunch / bike","answer":"Tom rides his bike after lunch.","alternatives":[],"explanation":"İngilis cümləsində əsas söz sırası: mübtəda + fel + tamamlıq/zərflik.","level":2,"mode":"sentence"},{"id":"q012","category":"order","prompt":"Anna / letters / on / Mondays / writes","answer":"Anna writes letters on Mondays.","alternatives":[],"explanation":"İngilis cümləsində əsas söz sırası: mübtəda + fel + tamamlıq/zərflik.","level":2,"mode":"sentence"},{"id":"q013","category":"order","prompt":"table / dog / the / sleeps / under / at / night / The","answer":"The dog sleeps under the table at night.","alternatives":[],"explanation":"İngilis cümləsində əsas söz sırası: mübtəda + fel + tamamlıq/zərflik.","level":2,"mode":"sentence"},{"id":"q014","category":"order","prompt":"bus / to / My / school / friends / go / by","answer":"My friends go to school by bus.","alternatives":[],"explanation":"İngilis cümləsində əsas söz sırası: mübtəda + fel + tamamlıq/zərflik.","level":2,"mode":"sentence"},{"id":"q015","category":"order","prompt":"a / father / My / works / day / every / hospital / in","answer":"My father works in a hospital every day.","alternatives":[],"explanation":"İngilis cümləsində əsas söz sırası: mübtəda + fel + tamamlıq/zərflik.","level":3,"mode":"sentence"},{"id":"q016","category":"order","prompt":"girl / The / home / draws / at / pictures","answer":"The girl draws pictures at home.","alternatives":[],"explanation":"İngilis cümləsində əsas söz sırası: mübtəda + fel + tamamlıq/zərflik.","level":3,"mode":"sentence"},{"id":"q017","category":"order","prompt":"eat / seven / at / I / breakfast","answer":"I eat breakfast at seven.","alternatives":[],"explanation":"İngilis cümləsində əsas söz sırası: mübtəda + fel + tamamlıq/zərflik.","level":3,"mode":"sentence"},{"id":"q018","category":"order","prompt":"Fridays / room / You / clean / on / your","answer":"You clean your room on Fridays.","alternatives":[],"explanation":"İngilis cümləsində əsas söz sırası: mübtəda + fel + tamamlıq/zərflik.","level":3,"mode":"sentence"},{"id":"q019","category":"order","prompt":"dinner / after / We / music / to / listen","answer":"We listen to music after dinner.","alternatives":[],"explanation":"İngilis cümləsində əsas söz sırası: mübtəda + fel + tamamlıq/zərflik.","level":3,"mode":"sentence"},{"id":"q020","category":"order","prompt":"on / the / the / The / in / afternoon / sits / cat / chair","answer":"The cat sits on the chair in the afternoon.","alternatives":[],"explanation":"İngilis cümləsində əsas söz sırası: mübtəda + fel + tamamlıq/zərflik.","level":3,"mode":"sentence"},{"id":"q021","category":"complete","prompt":"My sister ___ English every day. (study)","answer":"studies","alternatives":[],"explanation":"study → studies: samit + y ilə bitən feldə y → ies.","level":1,"mode":"word"},{"id":"q022","category":"complete","prompt":"He ___ to school at eight. (go)","answer":"goes","alternatives":[],"explanation":"He ilə go → goes.","level":1,"mode":"word"},{"id":"q023","category":"complete","prompt":"I ___ two brothers. (have)","answer":"have","alternatives":[],"explanation":"I ilə have işlənir.","level":1,"mode":"word"},{"id":"q024","category":"complete","prompt":"She ___ a new bag. (have)","answer":"has","alternatives":[],"explanation":"She ilə has işlənir.","level":1,"mode":"word"},{"id":"q025","category":"complete","prompt":"They ___ happy today. (be)","answer":"are","alternatives":[],"explanation":"They ilə are işlənir.","level":1,"mode":"word"},{"id":"q026","category":"complete","prompt":"My mother ___ a doctor. (be)","answer":"is","alternatives":[],"explanation":"Tək mübtəda ilə is işlənir.","level":1,"mode":"word"},{"id":"q027","category":"complete","prompt":"We ___ in Baku. (live)","answer":"live","alternatives":[],"explanation":"We ilə felin əsas forması işlənir.","level":1,"mode":"word"},{"id":"q028","category":"complete","prompt":"The baby ___ now. (sleep)","answer":"is sleeping","alternatives":[],"explanation":"Present Continuous: is + fel-ing.","level":2,"mode":"word"},{"id":"q029","category":"complete","prompt":"I ___ my homework now. (do)","answer":"am doing","alternatives":[],"explanation":"I ilə am + fel-ing.","level":2,"mode":"word"},{"id":"q030","category":"complete","prompt":"There ___ a pen on the desk. (be)","answer":"is","alternatives":[],"explanation":"Tək əşya ilə there is.","level":2,"mode":"word"},{"id":"q031","category":"complete","prompt":"There ___ three books in my bag. (be)","answer":"are","alternatives":[],"explanation":"Cəm əşyalarla there are.","level":2,"mode":"word"},{"id":"q032","category":"complete","prompt":"She ___ swim very well. (can)","answer":"can","alternatives":[],"explanation":"Bacarıq bildirən modal fel can.","level":2,"mode":"word"},{"id":"q033","category":"complete","prompt":"He ___ like coffee. (not/do)","answer":"does not","alternatives":[],"explanation":"He ilə doesn't/does not işlənir.","level":2,"mode":"word"},{"id":"q034","category":"complete","prompt":"I ___ a student. (be)","answer":"am","alternatives":[],"explanation":"I ilə am işlənir.","level":2,"mode":"word"},{"id":"q035","category":"complete","prompt":"Look! They ___ football. (play)","answer":"are playing","alternatives":[],"explanation":"They are + fel-ing.","level":3,"mode":"word"},{"id":"q036","category":"complete","prompt":"My dad ___ home at six. (come)","answer":"comes","alternatives":[],"explanation":"He/She/It ilə felə -s artırılır.","level":3,"mode":"word"},{"id":"q037","category":"complete","prompt":"We ___ got a car. (have)","answer":"have","alternatives":[],"explanation":"We ilə have got.","level":3,"mode":"word"},{"id":"q038","category":"complete","prompt":"She ___ got a cat. (have)","answer":"has","alternatives":[],"explanation":"She ilə has got.","level":3,"mode":"word"},{"id":"q039","category":"complete","prompt":"This is ___ apple. (a/an)","answer":"an","alternatives":[],"explanation":"Sait səslə başlayan sözlərdən əvvəl an.","level":3,"mode":"word"},{"id":"q040","category":"complete","prompt":"There is ___ book on the table. (a/an)","answer":"a","alternatives":[],"explanation":"Samit səslə başlayan sözlərdən əvvəl a.","level":3,"mode":"word"},{"id":"q041","category":"negative","prompt":"She likes tea.","answer":"She does not like tea.","alternatives":[],"explanation":"İnkar cümləsi: am/is/are + not; Present Simple üçün do/does + not + felin əsas forması; can + not.","level":1,"mode":"sentence"},{"id":"q042","category":"negative","prompt":"He plays basketball.","answer":"He does not play basketball.","alternatives":[],"explanation":"İnkar cümləsi: am/is/are + not; Present Simple üçün do/does + not + felin əsas forması; can + not.","level":1,"mode":"sentence"},{"id":"q043","category":"negative","prompt":"They live in London.","answer":"They do not live in London.","alternatives":[],"explanation":"İnkar cümləsi: am/is/are + not; Present Simple üçün do/does + not + felin əsas forması; can + const cats={order:'Sözləri düzgün sırala',complete:'Cümləni tamamla',negative:'İnkar cümləsi qur',question:'Sual cümləsi qur',correct:'Səhvi düzəlt',translate:'İngilis dilinə tərcümə et',build:'Cümlə qur',mixed:'Qarışıq tapşırıqlar'};
const icons={order:'🧩',complete:'✏️',negative:'🚫',question:'❓',correct:'🔍',translate:'🌍',build:'📝',mixed:'🚀'};
const app=document.getElementById('app');let user={},questions=[],idx=0;
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function startScreen(){app.innerHTML=`<section class="hero"><div class="eyebrow">✨ İNGİLİS DİLİNİ MƏŞQ ET</div><h1>İngiliscə cümlə qurmaq<br><span>indi daha asandır!</span></h1><p>8 mövzu · Hər məşqdə 20 sual · Müəllimə e-poçtla nəticə</p></section><section class="panel register"><h2>Özünü təqdim et 👋</h2><form id="f"><div class="two"><label>Adın<input id="first" required placeholder="Adın"></label><label>Soyadın<input id="last" required placeholder="Soyadın"></label></div><h3>Məşq seç</h3><div class="categories">${Object.entries(cats).map(([k,v])=>`<label class="category"><input type="radio" name="cat" required value="${k}"><span class="category-body"><span class="category-icon">${icons[k]}</span><strong>${v}</strong><small>20 sual</small><span class="tick">✓</span></span></label>`).join('')}</div><p style="color:var(--muted);font-size:12px">Məşqi bitirəndə ad-soyadın, cavabların və nəticən müəllimin e-poçtuna göndəriləcək.</p><button class="btn primary big">Məşqə başla →</button></form></section>`;document.getElementById('f').onsubmit=e=>{e.preventDefault();const chosen=document.querySelector('input[name=cat]:checked');if(!chosen)return;user={first:document.getElementById('first').value,last:document.getElementById('last').value,category:chosen.value};const prev=JSON.parse(localStorage.getItem('sa_recent_questions')||'[]');const options=bank.filter(x=>x.category===chosen.value);let available=options.filter(x=>!prev.includes(x.id));if(available.length<20)available=options;for(let i=available.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[available[i],available[j]]=[available[j],available[i]];}questions=available.slice(0,20).map(x=>({...x,response:''})).sort((a,b)=>a.level-b.level);localStorage.setItem('sa_recent_questions',JSON.stringify([...prev,...questions.map(q=>q.id)].slice(-450)));idx=0;renderQuiz();};}
function save(){questions[idx].response=document.getElementById('response').value;}
function nav(n){save();idx=Math.max(0,Math.min(19,n));renderQuiz();}
function renderQuiz(){const x=questions[idx];app.innerHTML=`<div class="quiz-header"><div><span class="eyebrow">${esc(user.first)} ${esc(user.last)}</span><h2>${cats[user.category]}</h2></div><div class="counter">${idx+1} / 20</div></div><div class="progress"><div style="width:${(idx+1)*5}%"></div></div><section class="panel quiz-panel"><span class="tag">${cats[user.category]}</span><h2>Tapşırığı yerinə yetir</h2><div class="prompt">${esc(x.prompt)}</div><label>Cavabını yaz<textarea id="response" rows="3" placeholder="Cavabını ingilis dilində yaz...">${esc(x.response)}</textarea></label><div class="actions"><button class="btn secondary" id="prev" ${idx===0?'disabled':''}>← Əvvəlki</button><button class="btn primary" id="next">Növbəti →</button></div></section><div class="dots">${questions.map((q,i)=>`<button class="qdot ${i===idx?'current':''} ${q.response?'done':''}" data-n="${i}">${i+1}</button>`).join('')}</div><button id="finish" class="btn finish">🏁 Testi tamamla və nəticəni gör</button>`;document.getElementById('prev').onclick=()=>nav(idx-1);document.getElementById('next').onclick=()=>nav(idx+1);document.querySelectorAll('.qdot').forEach(b=>b.onclick=()=>nav(+b.dataset.n));document.getElementById('finish').onclick=()=>{save();if(confirm('Cavabları yoxlayaq?'))renderResult();};}
function norm(s){return String(s||'').toLowerCase().trim().replace(/[’‘]/g,"'").replace(/\bcan't\b/g,'cannot').replace(/\bdoesn't\b/g,'does not').replace(/\bdon't\b/g,'do not').replace(/\bisn't\b/g,'is not').replace(/\baren't\b/g,'are not').replace(/\bi'm\b/g,'i am').replace(/\byou're\b/g,'you are').replace(/\bwe're\b/g,'we are').replace(/\bthey're\b/g,'they are').replace(/\bshe's\b/g,'she is').replace(/\bhe's\b/g,'he is').replace(/\bit's\b/g,'it is').replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim();}
function renderResult(){let correct=0,review=0;let results=questions.map(x=>{let ok=[x.answer,...x.alternatives].some(a=>norm(a)===norm(x.response));let status=ok?'correct':(!x.response.trim()?'incorrect':(['translate','build'].includes(x.category)?'review':'incorrect'));if(status==='correct')correct++;if(status==='review')review++;return {...x,status};});app.innerHTML=`<div class="result-head"><div class="trophy">🏆</div><h1>Afərin, ${esc(user.first)}!</h1><p id="delivery-status">Nəticən hazırdır. Müəllimə avtomatik göndərilir.</p><div class="score">${correct*5}<span>/100</span></div><div class="stats"><div><b>${correct}</b><small>Düzgün</small></div><div><b>${20-correct-review}</b><small>Səhv</small></div><div><b>${review}</b><small>Müəllim yoxlaması</small></div></div></div><h2>Sual-sual nəticələr</h2>${results.map((x,i)=>`<article class="answer-card"><div class="answer-top"><b>${i+1}. ${esc(x.prompt)}</b><span class="pill ${x.status}">${x.status==='correct'?'✓ Düzgün':x.status==='review'?'◷ Yoxlanacaq':'✕ Səhv'}</span></div><div class="answer-details"><p><small>Sənin cavabın</small><br><strong>${esc(x.response)||'—'}</strong></p><p><small>Nümunə düzgün cavab</small><br><strong>${esc(x.answer)}</strong></p></div><p class="explain">💡 ${esc(x.explanation)}</p></article>`).join('')}<section class="panel" id="send-panel"><h2>📨 Müəllimə göndərilmə</h2><p style="color:var(--muted)">Müəllim: <strong>namiq.b1993@gmail.com</strong>. Bütün 20 sual, sənin cavabların və düzgün cavablar göndəriləcək.</p><button class="btn primary big" id="send-results">📤 Nəticəni göndər</button><p id="send-feedback" style="font-size:13px;color:var(--muted)"></p></section><div class="center"><button class="btn secondary" id="restart">Yeni məşq →</button></div>`;document.getElementById('restart').onclick=startScreen;
const report=[`SENTENCE ACADEMY — ŞAGİRD HESABATI`,`Ad: ${user.first}`,`Soyad: ${user.last}`,`Məşq: ${cats[user.category]}`,`Tarix: ${new Date().toLocaleString('az-AZ')}`,`Nəticə: ${correct*5}/100`,`Düzgün: ${correct}/20`,`Müəllim yoxlaması: ${review}`,`QEYD: Avtomatik qiymət yalnız nümunə cavablarla uyğunluğu ölçür. Müəllim yoxlaması tələb edən cavablar son qiymətə daxil edilməyib.`,``,...results.flatMap((r,i)=>[`${i+1}. ${r.prompt}`,`Şagirdin cavabı: ${r.response||'(boş)'}`,`Düzgün cavab: ${r.answer}`,`Status: ${r.status==='correct'?'Düzgün':r.status==='review'?'Yoxlanmalıdır':'Səhv'}`,``])].join('\n');
const sendButton=document.getElementById('send-results');
const feedback=document.getElementById('send-feedback');
sendButton.onclick=async()=>{
 sendButton.disabled=true;sendButton.textContent='Göndərilir…';feedback.textContent='';
 const payload=new FormData();
 payload.append('_subject',`Sentence Academy | ${user.first} ${user.last} | ${correct*5}/100`);
 payload.append('_captcha','false');
 payload.append('_template','table');
 payload.append('Şagird',`${user.first} ${user.last}`);
 payload.append('Məşq',cats[user.category]);
 payload.append('Bal',`${correct*5}/100`);
 payload.append('Düzgün cavab sayı',String(correct));
 payload.append('Müəllim yoxlaması',String(review));
 payload.append('Tam hesabat',report);
 try {
  const resp=await fetch('https://formsubmit.co/ajax/namiq.b1993@gmail.com',{method:'POST',body:payload,headers:{'Accept':'application/json'}});
  const out=await resp.json();
  if(!resp.ok||out.success===false||out.success==='false')throw Error(out.message||'Göndərmə qəbul edilmədi');
  document.getElementById('delivery-status').textContent='Göndərmə sorğusu qəbul edildi.';
  feedback.textContent='✓ Göndərmə sorğusu qəbul edildi. E-poçt ünvanı FormSubmit-də təsdiqlənməyibsə, müəllim təsdiq məktubundakı linki açmalıdır.';
  feedback.style.color='#148667';sendButton.textContent='✓ Sorğu göndərildi';
 }catch(error){
  feedback.textContent='Avtomatik göndərmə mümkün olmadı. Aşağıdakı düymə ilə e-poçt proqramında hesabatı açın və göndərin. Səbəb: '+error.message;
  feedback.style.color='#a63b38';sendButton.textContent='↻ Yenidən yoxla';sendButton.disabled=false;
  if(!document.getElementById('mail-fallback')){
   const b=document.createElement('a');b.id='mail-fallback';b.className='btn secondary';b.style.marginTop='12px';b.textContent='✉ E-poçtla göndər (alternativ)';
   b.href='mailto:namiq.b1993@gmail.com?subject='+encodeURIComponent(`Sentence Academy | ${user.first} ${user.last}`)+'&body='+encodeURIComponent(report.slice(0,1500));
   b.onclick=()=>{if(report.length>1500){navigator.clipboard?.writeText(report).catch(()=>{});alert('Tam hesabatın mətnini də kopyalamağa cəhd edildi. E-poçta bütün cavabların daxil olduğunu yoxlayın.');}};
   document.getElementById('send-panel').appendChild(b);
  }
 }
};
sendButton.click();
}
startScreen();
</script></body></html>
